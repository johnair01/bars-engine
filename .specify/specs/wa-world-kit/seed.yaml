    as findings.
  semantic_ac_key: ac_49809707c36ffc8d
  verify_exemption_reason: Neither the CLI's location, language and invocation nor
    the kit's on-disk shape is fixed by a recorded decision, so no exact command can
    be named in advance
- description: A command/API check returns stable observable output or artifacts proving
    the original requirement for Publishing a valid kit with the CLI sends the kit
    through the engine's real gate, and an accepted kit appears in the author's dojo
    in the running local game.
  semantic_ac_key: ac_94b99782147f2391
  verify_exemption_reason: Proving the outcome needs a running local engine, a seeded
