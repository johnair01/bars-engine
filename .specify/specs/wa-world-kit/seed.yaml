constraints:
- Publishing goes through the engine's real gate; the CLI must not bypass it or use
  a substitute validation path
- The engine change is one thin route for findings
- The dojo is where locally authored kits live
- The world-kit repo and CLI handle both validating a kit and publishing it
- 'Test locally first: start the engine with scripts/local/dev.sh dev against a local
  Postgres database and never point a run at the production database'
- Before pushing an engine change, scripts/local/check.sh --build must pass, and the
  pull request must name the command and its result
- 'Do not merge your own bars-engine pull request: when the build check is green,
  mark the PR ready for review and add the ship-next label'
- Any question whose answer changes what gets built goes through the six-faces reach
  test and onto the Council Board, never into chat
- 'Prisma schema changes follow the migrations-only workflow: run npx prisma migrate
  dev and migrate deploy, never db push'
- Tests, previews and looks use the cultivation character model, never average-dusk.glb
- Resolve Seed QA feedback before execution without copying recovery persona prompts,
  failed-run transcripts, or diagnostic prose.
