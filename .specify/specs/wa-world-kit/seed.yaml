goal: Build a publish path that takes a world kit authored locally into the running
  bars-engine game. It has two parts. The first is a world-kit repo with a CLI that
  validates a kit and publishes it through the engine's real gate. The second is one
  thin engine route that returns gate findings. Locally authored kits land in the
  dojo, their home in the game.
task_type: code
brownfield_context:
  project_type: brownfield
  context_references:
  - path: /Users/wendellbritt/.ouroboros/worktrees/wa-kit/auto_6c234f5ec5c2
    role: primary
    summary: 'bars-engine worktree: a Next.js, Prisma and TypeScript game engine holding
      the kit gate and the dojo; the findings route is added here'
  - path: docs/LOCAL_FIRST_TESTING.md
    role: reference
    summary: 'Local-first testing procedure: dev.sh, check.sh --build and the ship-next
      flow'
  - path: docs/PRISMA_MIGRATE_STRATEGY.md
