ontology_schema:
  name: WorldKitPublishPath
  description: A world kit authored locally, the CLI that validates and publishes
    it, the engine gate that judges it, the findings the gate returns, and the dojo
    entry an accepted publish produces
  fields:
  - name: kit
    type: object
    description: 'A world kit authored on disk: its identity, metadata and content
      files'
    required: true
  - name: kitId
    type: string
    description: Stable identifier of the world kit across publishes
    required: true
  - name: author
    type: string
    description: The player or account that owns the published kit
    required: true
  - name: gateResult
    type: object
    description: 'Outcome of passing the kit through the engine''s real gate: accepted
      or refused'
    required: true
  - name: findings
    type: array
    description: Findings the gate produced for the kit, returned by the engine's
      findings route
    required: true
  - name: findingSeverity
    type: string
    description: How severe each finding is, which decides whether the finding blocks
      publishing
    required: true
  - name: dojoEntry
    type: object
    description: The kit's entry in the author's dojo after an accepted publish
    required: true
  - name: engineUrl
    type: string
    description: The address of the bars-engine instance the CLI publishes to
    required: true
  - name: exitStatus
    type: number
    description: The CLI's process exit status, which reports the publish or validation
      outcome
    required: true
evaluation_principles:
- name: Real gate fidelity
  description: Publishing uses the engine's actual gate code, not a copy or a stand-in
  weight: 0.3
- name: Minimal engine footprint
  description: The engine gains one thin findings route, and other engine changes
    are avoided unless the requester's answers allow them
  weight: 0.2
- name: Author legibility
  description: The CLI output tells the author clearly whether the kit was published
    and what the findings are
  weight: 0.2
- name: Local-first verification
  description: Everything is shown working against a local engine and database, never
    production
  weight: 0.15
- name: Fidelity to requester answers
  description: The work follows the requester's verbatim answers over any assumption
    in this spec
  weight: 0.15
exit_conditions:
- name: Publish path proven locally
  description: A sample kit is validated and published through the real gate into
    the dojo on a local engine, and a broken kit is refused with findings shown
  criteria: All acceptance criteria are met, and scripts/local/check.sh --build is
    green on the engine branch
- name: PR handed to daily ship
  description: The engine change is ready for the daily shipping session
  criteria: The PR is marked ready for review and labeled ship-next, and the author
    did not merge it
- name: Blocking question escalated
  description: A decision only Wendell can make blocks progress
  criteria: The question passed the reach test and is posted on the Council Board,
    and work stops on the blocked point
