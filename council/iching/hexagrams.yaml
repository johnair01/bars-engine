  lower: water
  upper: mountain
  shows: You are guessing where you could ask.
  image: ☵ water beneath ☶ mountain. A spring at the foot of a peak, with mist over all of it.
  situation: 'Something is genuinely obscured, and the obscured thing is the one looking. The frame is a young person
    who has yet to learn, and the instruction runs toward the asker: the teacher answers the first question honestly
    and goes quiet by the third, because a question put three times has stopped being a question.'
