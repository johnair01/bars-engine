  upper: thunder
  shows: The good part has started and the event has not.
  image: ☷ earth beneath ☳ thunder. Thunder coming up out of the ground, the sound arriving before the storm.
  situation: Stored energy at the point of release. The character carries both readiness and delight, and the old
    commentary attaches music to it — the thing that gathers a crowd before anything has happened. Preparation and
    pleasure are the same motion here.
