  - 1
  - 1
  - 1
  - 1
  lower: heaven
  upper: heaven
  shows: Every line here sends, and the return has nowhere to land.
  image: ☰ heaven beneath ☰ heaven. Six unbroken lines, and no place in the figure that yields.
  situation: Every line is pushing and every line is capable. This is the most able configuration in the set, and
    it has nowhere to put anything that arrives. The tradition walks a dragon up through six stages for exactly
    this reason — force has to learn timing, because force alone already knows everything else.
- n: 2
