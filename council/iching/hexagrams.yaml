  lower: lake
  upper: heaven
  shows: You are stepping onto ground that matters, and the play is what makes it safe.
  image: ☱ lake beneath ☰ heaven. A small soft thing placed directly under the largest hard one.
  situation: The old line is about treading on a tiger's tail and coming away whole, which happens through the quality
    of the step. Conduct is the entire content here. Where you put your weight, in what order, at what speed, decides
    whether the ground holds.
- n: 11
  name: Mingling
  cn: 泰
  pinyin: tài
  lines:
