  lower: heaven
  upper: earth
  shows: This is working, and you should know why.
  image: ☰ heaven beneath ☷ earth. Heaven has taken the lower place, so its rising and earth's settling cross in
    the middle.
  situation: The two halves face each other. Heaven below sends its force up through earth above, which comes down
    to receive it, and the exchange runs in both directions at once. The tradition treats this as the most fortunate
    arrangement in the set and immediately warns that flat ground turns to slope.
- n: 12
