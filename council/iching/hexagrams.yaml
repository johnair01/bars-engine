  image: ☴ wind beneath ☶ mountain. Still air trapped under a mountain, going stale.
  situation: 'Something has spoiled through inattention rather than through damage. The character shows a bowl with
    worms in it: what happens to a thing left standing. The instruction is unusual in the set — it gives three days
    before and three days after, so the work of repair is bracketed by thinking about how it got here.'
