  lower: heaven
  upper: water
  shows: You are ready and the ground is not.
  image: ☰ heaven beneath ☵ water. Clouds gathered, no rain fallen.
  situation: Strength is fully present underneath. This is not weakness waiting; it is the creative held in place
    by a depth it cannot yet cross. Since crossing is not available, the tradition says eat and drink. Nourishment
    is the move when advance is not.
