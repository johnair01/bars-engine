  upper: lake
  shows: You broke the pattern open, and you are now inside what it opened.
  image: ☳ thunder beneath ☱ lake. Thunder has gone quiet under the water and travels where the water travels.
  situation: Falling in with something already in motion. The old text says to go indoors at dusk and rest, because
    the season has turned and the correct action now is to stop leading. The commentary adds that the one who follows
    well is in turn followed.
