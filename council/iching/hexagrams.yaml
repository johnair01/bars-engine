  image: ☱ lake beneath ☷ earth. Two firm lines rising at the base, with the ground open above them.
  situation: 'Something is coming up and there is room above it. The old text puts a date on it, saying trouble
    arrives in the eighth month, which turns the reading into a clock: this is favourable and it is favourable now.
    Spring approaches, and the approach is the whole of it.'
