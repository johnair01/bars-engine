  shows: You are going deeper and pushing forward at once, and the two cancel.
  image: ☵ water beneath ☰ heaven. Heaven rises, water sinks. The two halves are travelling apart.
  situation: Two forces inside one figure heading opposite ways, so the friction here is structural. The counsel
    is to stop at the halfway point and to decline the great river, because a dispute carried to its end costs more
    than whatever was in dispute.
