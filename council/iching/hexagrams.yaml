  shows: You are walking the same way and neither of you has said so.
  image: ☲ fire beneath ☰ heaven. Fire rising to meet the sky it is already heading for.
  situation: Two things going the same way, which is what makes company possible. The old text sets this in the
    open country, out where the group has no walls around it, and says the union works when it is available to anyone
    who arrives.
- n: 14
  name: Noon
  cn: 大有
  pinyin: dà yǒu
  lines:
