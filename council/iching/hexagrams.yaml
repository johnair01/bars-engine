  lower: earth
  upper: heaven
  shows: You are seeking one game and wearing the face of the other.
  image: ☷ earth beneath ☰ heaven. Each half is already where it wants to be, so nothing crosses the middle.
  situation: Heaven rises and it is already on top. Earth settles and it is already at the bottom. Both halves are
    content and the figure has no traffic in it. Obstruction here comes from satisfaction rather than from conflict,
    which is what makes it durable.
- n: 13
