  - 0
  lower: earth
  upper: earth
  shows: The whole weight of this is yours, unasked.
  image: ☷ earth beneath ☷ earth. Six broken lines. Every one of them has a gap at the centre.
  situation: 'Pure capacity to hold. The figure carries whatever is set on it and supplies no direction of its own.
    Its instruction is to follow, and that is how ground carries what is set on it. The image is a mare: strength
    that goes where it is pointed, for a very long way.'
