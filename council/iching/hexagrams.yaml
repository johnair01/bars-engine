  lower: water
  upper: earth
  shows: What would organise this is a fact you have not said.
  image: ☵ water beneath ☷ earth. One firm line among five yielding ones, holding the whole figure to a shape.
  situation: 'Water stored underground: a resource that is present, invisible, and organised. The single strong
    line is the discipline that turns a crowd into a force. The old warning is that this works with an experienced
    hand and a clear cause, and the same gathering under any other conditions is a mob.'
- n: 8
