  lower: mountain
  upper: earth
  shows: What you are underplaying had better be there.
  image: ☶ mountain beneath ☷ earth. A mountain sitting below ground level.
  situation: Height in the low position. The figure has real elevation and puts it underneath, which is the only
    configuration in the set the tradition calls good in every line. What makes it work is that the height is genuine
    — a low place with nothing in it is just a low place.
