  image: ☳ thunder beneath ☰ heaven. Movement underneath the sky, going the sky's own way.
  situation: The name means without falsity, and the figure describes action with no calculation folded into it.
    The old text puts the unlooked-for misfortune here as well — the cow left tied that a passing traveller takes.
    Acting straight leaves you open to whatever arrives.
