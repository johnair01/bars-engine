about: 'The 64 hexagrams in the King Wen order: number, Chinese name, pinyin, lines from the bottom up (1 unbroken,
  0 broken), and the two trigrams, lower then upper. Each also carries Wendell''s reading from flirtcraft''s lib/decks.json:
  his name for it, what it shows, its image and its situation. The flirting applications stay in flirtcraft: the
  flirtation line, the drill, and the craft names. Wendell, 2026-10-03: "The valuable parts for flirtcraft are their
  flirting applications so it fine to have this in the public repo". The lines were checked against the trigrams.'
