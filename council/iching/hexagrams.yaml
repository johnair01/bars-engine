  lower: earth
  upper: water
  shows: This is filling a hole you had before it started.
  image: ☷ earth beneath ☵ water. Water lying on ground, finding every hollow and filling it.
  situation: Water on earth touches at every point along the surface. Union across the whole of it. The classical
    note is about timing — those who arrive late to a union already forming find the places taken.
- n: 9
  name: Restraint
  cn: 小畜
  pinyin: xiǎo chù
  lines:
