  lower: heaven
  upper: fire
  shows: There is a lot here, and all of it is visible.
  image: ☰ heaven beneath ☲ fire. The sun at the top of the sky, with the whole day's strength under it.
  situation: 'Great possession: everything visible at once, in full light. The single yielding line sits fifth and
    holds the rest, which is the classical point — abundance is held by the soft place in it. The warning attached
    is about pride, since noon is also the moment the light starts down.'
- n: 15
