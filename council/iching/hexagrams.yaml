  lower: heaven
  upper: wind
  shows: A small rule you never revisited is holding all of this.
  image: ☰ heaven beneath ☴ wind. One yielding line holding five firm ones, the way weather is held by wind.
  situation: 'A small force restrains a large one here, and the large one is permitting it. The single yielding
    line''s whole strength is position. The tradition reads the restraint as accumulation: force that cannot discharge
    yet is being stored.'
- n: 10
