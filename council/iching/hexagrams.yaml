  shows: This is early, and you are reading the mess as a verdict.
  image: ☳ thunder beneath ☵ water. Movement caught inside the danger it was born into.
  situation: A first shoot pushing at a hard crust. Everything necessary is present, in a heap. The old counsel
    is to appoint helpers and to decline any journey, because at this stage every unit of effort belongs to getting
    established.
- n: 4
