# Lint, Prisma validate, type-check — same ritual as npm run check (strand: build-reliability).
name: Frontend check

on:
  push:
    branches: [main, master]
  # Deliberately UNFILTERED. On a pull_request trigger, `branches:` matches the
  # BASE branch — so a `[main, master]` filter silently skips every stacked PR,
  # which are the ones most worth checking. A five-deep ally-campaign stack got
  # no CI at all before this: only the one branch based on main was ever seen.
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # prisma validate requires DATABASE_URL; does not need a running Postgres
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Check (generate + verify + lint + tsc)
        run: npm run check

      # The inner vessel's model in the Cave of Lessons (content/ontology-game/cave/vessel.js). Plain node, no browser.
      - name: Ship model checks
        run: npm run test:vessel

      # Blender pipeline, offline tier only: licence gate, manifest budgets, key handling. Plain Python, no bpy.
      # Known gaps are logged and do not fail the job (.specify/specs/blender-pipeline-test/).
      - name: Blender pipeline tests (offline)
        run: python3 tools/blender-cloud/tests/run.py --tier offline
