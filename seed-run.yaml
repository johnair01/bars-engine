  source: answered by Wendell in thread, 2026-11-23; recorded in council/ledger/rulings.jsonl
  ruling_1: >-
    Republish updates in place; no new records, findings never duplicated.
  ruling_2: >-
    Token in an environment variable; never in the kit folder.
  ruling_3: >-
    Success check: findings stored with stable ids, CLI reports new vs updated.
  ruling_4: >-
    Non-secret metadata travels with the kit; secrets never do.
  ruling_5: >-
    Long-lived token in the Authorization header; no session exchange.
