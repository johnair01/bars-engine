ontology_schema:
  name: WorldKitPublishPath
  description: A locally authored world kit is validated and published by the world-kit
    CLI through the bars-engine gate into a dojo. The engine's findings route reports
    the gate's results.
  fields:
  - name: kit
    type: object
    description: 'A locally authored world kit: its identity, its metadata and its
      content files'
    required: true
  - name: kit_id
    type: string
    description: The kit's identity, used to recognize the kit when it is published
      again
    required: true
  - name: engine_url
    type: string
    description: The bars-engine instance the CLI publishes to
    required: true
  - name: gate_result
    type: object
    description: 'The outcome of running the kit through the engine''s real gate:
      accepted, accepted with warnings, or rejected'
    required: true
  - name: findings
    type: array
    description: The gate's findings for a kit, returned by the engine's thin findings
      route
    required: true
  - name: dojo_record
    type: object
    description: The published kit as it sits in the dojo
    required: true
  - name: author
    type: object
    description: The local author whose dojo receives the kit
    required: true
  - name: cli_exit_status
    type: number
    description: The CLI's exit status after validate or publish
    required: true
evaluation_principles:
- name: single_gate_truth
  description: The engine's real gate decides whether a kit is accepted; the publish
    path never bypasses or forks it
  weight: 0.3
- name: fidelity_to_requester_answers
  description: Behavior matches the requester's quoted answers and does not reconstruct
    guesses
  weight: 0.25
- name: thin_engine_footprint
  description: Engine changes stay minimal and centered on the one findings route
  weight: 0.2
- name: actionable_findings
  description: An author who receives findings can act on them
  weight: 0.15
- name: local_first_verification
  description: Everything is tested against a local engine and database, never production
  weight: 0.1
exit_conditions:
- name: publish_path_works
  description: Validating and publishing a kit work end to end against a local engine
  criteria: Every acceptance criterion holds, the end-to-end check from the requester's
    answer passes locally, and scripts/local/check.sh --build is green on the engine
    branch
- name: blocked_on_ruling
  description: A decision is needed that the record cannot answer
  criteria: The question is posted to the Council Board after the reach test, and
    work stops on that point
- name: handoff
  description: The session's context budget is close to running out
  criteria: The session has reread about 250,000 tokens per call; the work is recorded
    and handed off
