assumptions:
- The CLI is named world-kit and has subcommands validate and publish, taking a kit
  directory and an --engine <url> option. This shape comes from question wording,
  not from a decision.
- A kit is a folder with a manifest (for example kit.yaml) giving a stable kit id,
  name and version, plus content files. This is illustrative only.
- Findings carry a stable id, a kind and a file location, and the CLI exits non-zero
  when a kit is rejected. This is illustrative only.
- Authentication is not built in this slice, and published kits go to one existing
  local dev player's dojo. This was never confirmed.
- publish reuses an existing gate-backed ingest path in the engine, and promotion
  beyond the dojo is out of scope. This was never confirmed.
- The target engine is a bars-engine dev server running locally on the author's machine
- The world-kit repo's exact location and name are not fixed; the worker chooses them
  unless the requester's answers say otherwise
requester_answers:
- question: 'When `publish` succeeds, what end state counts as "done": is the kit
    immediately live and playable in the dojo for any player, staged in the dojo only
    for its author until something else promotes it, or something else?'
  answer: 'When `publish` succeeds, the kit is placed in the dojo and is immediately
    live only for its author; it is not promoted to other players until a later step.
    record: "the dojo is the home for locally authored kits"; .specify/specs/wa-world-kit/seed.yaml:236-239'
- question: When the engine's real gate rejects a kit (or accepts it with warnings),
    what should the thin findings route return to the CLI, and is a rejected publish
    expected to leave nothing in the dojo, or a partial/draft record the author can
    inspect?
  answer: 'assumption: The thin findings route should return a findings envelope containing
    the engine‑assigned stable id and kind for each finding, and a rejected publish
    should leave no world record in the dojo – only the findings are presented to
    the author.'
- question: When an author runs `publish` again for a kit already in their dojo, should
    the new version replace the existing one in place, be added as a new version beside
    it, or be refused until the author removes the old one?
  answer: 'assumption: The interview’s draft answer that republishing replaces the
    existing kit in place is based on assumption, not on any documented rule in the
    repository or the record.'
- question: '(ambiguity: 0.35) When the CLI publishes, how should the engine know
    which author''s dojo the kit belongs to, given that ''live only for its author''
    depends on it? Should it reuse an existing engine session or token, use a new
    kit-specific credential, or should local-only/dev use without auth be acceptable
    for now?'
  answer: The publish command must include an engine API token that identifies the
    author; the engine maps that token to a player account and assigns the kit to
    the author’s dojo, enforcing ‘live only for its author’. No new login flow is
    added – the token is stored outside the kit folder and supplied to the CLI (admin‑issued
    for dev).
- question: '(ambiguity: 0.32) If an author republishes a kit with the same identity
    but changed content, should the engine replace the existing dojo record in place
    (possibly breaking any in-progress play state), keep the old version and add the
    new one beside it, or reject it until the old one is removed? Is breaking in-progress
    play state acceptable in this first slice?'
  answer: The engine should replace the existing dojo record in place when a kit is
    republished, even if that breaks any in‑progress play state, because the specification
    states republishing “updates and never duplicates.”
- question: '(ambiguity: 0.28) Is the new findings route the only engine change allowed
    in this slice, with `publish` reusing an existing gate-backed ingest path and
    any existing token check, or may the engine also gain a new or modified publish/ingest
    endpoint?'
  answer: 'assumption:'
- question: '(ambiguity: 0.31) So that the Seed can record concrete inputs and outputs
    for the CLI: when an author runs `world-kit publish ./my-kit --engine <url>` with
    the token from an environment variable, what exactly does `./my-kit` contain,
    and what exactly does the command return? For example, the kit could be a folder
    with a `kit.yaml` manifest giving a stable kit id, name and version, plus content
    files. On success, the CLI could print the dojo world id and URL and exit 0. On
    rejection, it could print each finding''s stable id, kind and file location and
    exit non-zero, with a `--json` flag that emits the raw findings envelope. Is that
    the contract, or does it differ?'
  answer: 'The contract is that `world-kit publish ./my-kit --engine <url>` expects
    `./my-kit` to be a folder containing `world.yaml`, `world.md`, `conditions.yaml`,
    `obstacles.yaml`, `npcs.yaml` and a `portraits/` directory; on success the CLI
    prints the dojo world id (and signature) and exits 0, while on rejection it prints
    each finding’s stable id, kind and file location and exits non‑zero, with a `--json`
    flag to emit the raw findings envelope. (record: .specify/specs/wa-world-kit/seed.yaml:193-201;
    .specify/specs/wa-world-kit/seed.yaml:204-207)'
- question: '(ambiguity: 0.31) So the Seed can record the runtime context and the
    engine-side scope: when an author runs `world-kit publish ./my-kit --engine <url>`,
    what is that URL? Is it a bars-engine instance running locally on the author''s
    machine, a shared dev deployment, or either? And should the CLI send the kit to
    an existing gate-backed ingest endpoint, with the new findings route as the only
    engine change, or is a new or modified publish endpoint allowed in this slice?'
  answer: 'The URL is the engine’s dev server URL (by default the locally‑started
    bars‑engine instance), and the CLI posts the kit to the existing gate‑backed ingest
    endpoint, adding only the new thin publish route for findings without creating
    any additional engine routes. record: .specify/specs/wa-world-kit/seed.yaml:95-96;
    record: .specify/specs/wa-world-kit/seed.yaml:176-185; record: .specify/specs/wa-world-kit/seed.yaml:312-313'
- question: '(ambiguity: 0.41) What single end-to-end check should prove this feature
    is done? For example: a sample kit is run through `publish` against a running
    engine, it appears playable in the author''s dojo, another player cannot see it,
    and a deliberately broken kit returns findings with stable ids and leaves no dojo
    record. Is that the acceptance test, or is it something else?'
  answer: Run `world‑kit publish` against a live engine and verify that a successful
    kit appears playable in the author’s dojo, that re‑publishing the same kit is
    idempotent, and that a deliberately broken kit is rejected, returns stable finding
    IDs and leaves no dojo record. <.specify/specs/wa-world-kit/seed.yaml:141-144>
    <.specify/specs/wa-world-kit/seed.yaml:146-147> <.specify/specs/wa-world-kit/seed.yaml:149-149>
- question: '(ambiguity: 0.30) Should `world-kit validate` run offline with its own
    copy of the rules, or must it call the engine''s real gate (for example, a dry-run
    through the findings route) so the engine stays the single source of truth? And
    is it acceptable for the CLI to report a kit as valid that `publish` then rejects?'
  answer: Validate can run offline using a copy of the rules, but the engine’s gate
    is the ultimate source of truth; therefore `world-kit publish` must call the engine’s
    real gate, and it is acceptable for the CLI to report a kit as valid in the offline
    step even if the later publish is rejected, because the engine will return findings
    for the author. .specify/specs/wa-world-kit/seed.yaml:97‑98,141,198‑201,226‑227
