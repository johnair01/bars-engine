goal: Build a publish path that takes a world kit authored locally and puts it into
  the running bars-engine game. It needs a world-kit repo with a CLI that validates
  a kit and publishes it through the engine's real gate, plus one thin engine route
  that returns findings. The dojo is where locally authored kits live.
task_type: code
brownfield_context:
  project_type: brownfield
  context_references:
  - path: /private/tmp/wa-kit
    role: primary
    summary: The bars-engine codebase (Next.js 14+, TypeScript, Prisma/PostgreSQL),
      which gains the thin findings route and holds the gate and the dojo
  - path: /private/tmp/wa-kit/CLAUDE.md
    role: reference
    summary: 'Project rules: Council Board for questions, local-first testing, ship-next
      labeling, no db push'
  - path: /private/tmp/wa-kit/docs/LOCAL_FIRST_TESTING.md
    role: reference
    summary: How to run the dev server, run the build check and show work locally
  - path: /private/tmp/wa-kit/docs/PRISMA_MIGRATE_STRATEGY.md
    role: reference
    summary: The migrations-only database workflow
  - path: /private/tmp/wa-kit/ARCHITECTURE.md
    role: reference
    summary: Engine architecture
  existing_patterns:
  - Next.js app routes in src/ with tests in tests/ (vitest)
  - Local dev server via scripts/local/dev.sh dev; build check via scripts/local/check.sh
    --build
  - Prisma schema changes only through migrations (migrate dev, then migrate deploy,
    then db:record-schema-hash)
  - Pull requests are labeled ship-next instead of self-merged
  - Questions that change what gets built go to the Council Board
  existing_dependencies:
  - TypeScript
  - Next.js 14+
  - Prisma (PostgreSQL)
  - Tailwind CSS
  - AI SDK
  - vitest
constraints:
- Publishing must go through the engine's real gate, not a copy or bypass of it
- On the engine side, this slice adds one thin route for findings
- The dojo is where locally authored kits live
- The world kit and its CLI live in their own world-kit repo, separate from the bars-engine
  engine code
- Engine changes are tested locally against a local database using scripts/local/dev.sh;
  local runs never point at production
- Before a bars-engine pull request is pushed, scripts/local/check.sh --build must
  pass, and the pull request names that command and its result
- 'The bars-engine pull request is not self-merged: when it is green it is marked
  ready for review and labeled ship-next'
- prisma db push is forbidden; any schema change uses prisma migrate dev, then migrate
  deploy, then npm run db:record-schema-hash
- Any question whose answer changes what gets built goes to the Council Board through
  the six faces' reach test, never into chat
- Tests, previews and looks use the cultivation characters, never average-dusk.glb
- 'The requester''s answers on these points reach the worker verbatim and bind as
  quoted: what a successful publish ends in, what the findings route returns and what
  a rejected publish leaves behind, republish behavior, the end-to-end check, author
  identity, whether validate runs offline or calls the engine gate, how far engine
  changes go beyond the findings route, the kit''s contents and the CLI''s output,
  and the target engine URL'
- Resolve Seed QA feedback before execution without copying recovery persona prompts,
  failed-run transcripts, or diagnostic prose.
