<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#86b84f">
<title>Your farm</title>
<!-- BARs farm slice one (six-faces-council .specify/specs/bars-farm, round 3 look): a 14 x 11 grid of slots, the hoe, planting, watering, ripening, low weeds, picking, the deepen view with the Protector. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #cfe8f3; font-family: 'Atkinson Hyperlegible', sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; touch-action: none; }
  .top { position: fixed; z-index: 20; top: calc(10px + env(safe-area-inset-top, 0px)); left: 12px; right: 12px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .pill { background: rgba(42,51,47,.78); color: #f3ece2; border-radius: 14px; padding: 8px 12px; font-size: .9rem; }
  .pill b { font-family: Marcellus, serif; font-size: 1.05rem; display: block; }
  button { min-height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,.28); background: #3f6a3a; color: #f3ece2; font: 700 .95rem 'Atkinson Hyperlegible', sans-serif; padding: 0 14px; cursor: pointer; }
  button.alt { background: transparent; } button:disabled { opacity: .45; }
  button:focus-visible, input:focus-visible { outline: 2px solid #ffc46a; outline-offset: 2px; }
  .card { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(92vw, 520px); box-sizing: border-box;
    background: rgba(42,51,47,.88); color: #f3ece2; border-radius: 16px; padding: 12px 14px; display: grid; gap: 8px; }
  .card h2 { margin: 0; font: 400 1.25rem Marcellus, serif; } .card p { margin: 0; font-size: .92rem; opacity: .85; }
  .card .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .card input { flex: 1; min-width: 0; min-height: 44px; box-sizing: border-box; padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,.28); background: rgba(0,0,0,.25); color: inherit; font: 1rem sans-serif; }
  /* the deepen card sits at the right on a wide screen, so the Protector's bubble (left of centre) is never under it */
  .card.deepen { background: #f3e6c8; color: #2a1a12; border: 4px solid #b8261a; left: auto; right: 24px; transform: none; top: 90px; bottom: auto; width: min(44vw, 420px); }
  .card.deepen .alt { color: #2a1a12; border-color: #b8261a; }
  @media (max-width: 700px) { .card.deepen { right: 4vw; left: 4vw; width: auto; top: auto; bottom: 12px; } }
  .seeds { position: fixed; z-index: 22; right: 12px; top: calc(64px + env(safe-area-inset-top, 0px)); width: min(86vw, 300px); max-height: 46vh; overflow: auto; box-sizing: border-box;
    background: rgba(42,51,47,.86); color: #f3ece2; border-radius: 14px; padding: 10px 12px; }
  .seeds h2 { margin: 0 0 6px; font: 400 1.05rem Marcellus, serif; }
  .seeds ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .seeds li { border-top: 1px solid rgba(255,255,255,.16); padding-top: 8px; font-size: .9rem; }
  .seeds li b { display: block; font-weight: 700; } .seeds li span { opacity: .8; }
  .seeds a { color: #ffc46a; } .seeds a:focus-visible { outline: 2px solid #ffc46a; outline-offset: 2px; }
  @media (max-width: 700px) { .seeds { top: auto; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); right: 4vw; left: 4vw; width: auto; max-height: 28vh; } }
  .cap { position: fixed; z-index: 25; left: 50%; transform: translateX(-50%); top: calc(76px + env(safe-area-inset-top, 0px)); width: min(90vw, 560px); text-align: center; font: 1.05rem/1.45 Marcellus, serif; color: #2a332f; text-shadow: 0 1px 6px rgba(255,255,255,.8); opacity: 0; transition: opacity .8s; pointer-events: none; }
  .cap.on { opacity: 1; }
  #loading { position: fixed; inset: 0; z-index: 60; background: #cfe8f3; display: grid; place-items: center; font: 1.2rem Marcellus, serif; color: #2a332f; transition: opacity .8s; } #loading.gone { opacity: 0; pointer-events: none; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
</head><body>
<div id="stage" aria-label="Your farm. Tap a slot to walk there and choose what to do."></div>
<div id="loading">Through the portal…</div>
<div class="top"><div class="pill"><b>Your farm</b><span id="stats"></span></div><button type="button" id="homeBtn" class="alt" style="background:rgba(42,51,47,.78)">Home</button></div>
<div class="cap" id="cap" aria-live="polite"></div>
<div class="card" id="card" hidden></div>
<aside class="seeds" id="seeds" hidden aria-label="Seeds sent from your BARs"></aside>
<script type="module" src="/between/farm/farm.js"></script>
</body></html>
