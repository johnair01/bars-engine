<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b120d">
<title>Your BARs</title>
<!-- The character sheet's BAR shelf (board bar-two-sides-look-3, A, Wendell 2026-11-22): the BARs the Elder handed you, each drawn with a card you flip, the seal on one side and the moment on the other. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  :root { --ui-display: Marcellus, Georgia, serif; --ui-body: 'Atkinson Hyperlegible', system-ui, sans-serif; }
  html, body { margin: 0; background: #1b120d; color: #f6ecdc; font: 400 16px/1.45 var(--ui-body); }
  main { box-sizing: border-box; max-width: 640px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top, 0px)) 16px 40px; }
  h1 { margin: 0 0 4px; font: 400 1.7rem var(--ui-display); }
  .lede { margin: 0 0 22px; color: #c9b49a; }
  section { margin: 0 0 34px; }
  h2 { margin: 0 0 12px; font: 700 .8rem var(--ui-body); letter-spacing: .08em; text-transform: uppercase; color: #c9b49a; }
  .empty { padding: 18px; border-radius: 12px; background: rgba(255,255,255,.05); }
  a { color: #e6c98a; }
</style></head><body>
<main>
  <h1>Your BARs</h1>
  <p class="lede">The BARs the Elder handed you. Tap a BAR to flip it: the seal you drew on one side, the moment you made it in on the other.</p>
  <div id="shelf" aria-live="polite"><p class="empty">Opening your BARs…</p></div>
</main>
<script type="module">
import { barCard } from './bar-card.js';
const shelf = document.getElementById('shelf');
const day = t => { const d = new Date(t); return isNaN(+d) ? '' : d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }); };
(async () => {
  let bars = [];
  try {
    const r = await fetch('/api/between/quest-bar?all=1', { credentials: 'same-origin' });
    if (r.status === 401) { shelf.innerHTML = '<p class="empty">Sign in to bars-engine to see the BARs you were handed.</p>'; return; }
    bars = r.ok ? (await r.json()).bars || [] : [];
  } catch (e) { /* offline */ }
  if (!bars.length) { shelf.innerHTML = '<p class="empty">No BAR yet. The Elder at the Heaven sect altar hands you the first.</p>'; return; }
  shelf.replaceChildren();
  bars.forEach((b, i) => {
    const s = document.createElement('section'), h = document.createElement('h2');
    h.textContent = (b.ended ? 'Done · ' : 'Open · ') + day(b.at);
    s.append(h, barCard({ seal: b.seal, title: 'Tonight', moment: { sentence: b.sentence, at: b.at }, id: 'b' + i }));
    shelf.append(s);
  });
})();
</script>
</body></html>
