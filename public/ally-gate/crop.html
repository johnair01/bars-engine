<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The bed</title>
<!-- The founder's gate walk (/ally/gate): the player's bed with their crop. Messages from the walk:
     {type:"ally-gate-crop", family: "anger"|"sadness"|"fear"|"joy"|"neutrality"|null, grow: 0..1, ripe: bool}.
     Ripe draws the family's crop (crops.js, design pass satisfaction-crops-2026-11-16); before ripe the plant is leafy;
     a null family draws the farm's generic pod. Same toon ramp as public/between/farm/farm.js. -->
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}canvas{display:block;width:100%;height:100%}</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
</head><body>
<script type="module">
import * as THREE from "three";
import { cropMesh, toon } from "/ally-gate/crops.js";
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(34, 1, 0.1, 50);
camera.position.set(0, 1.3, 3.7); camera.lookAt(0, 0.55, 0);
const sun = new THREE.DirectionalLight("#fff4dc", 2.2); sun.position.set(-3, 5, 3); sun.castShadow = true; scene.add(sun);
scene.add(new THREE.HemisphereLight("#dff1ff", "#6a8a45", 1.0));
const mesh = (g, m) => { const x = new THREE.Mesh(g, m); x.castShadow = true; x.receiveShadow = true; return x; };
const bed = new THREE.Group();
{ const slab = mesh(new THREE.BoxGeometry(1.5, 0.1, 1.2), toon("#5e3a22")); slab.position.y = 0.05; bed.add(slab); }
for (let f = 0; f < 3; f++) { const r = mesh(new THREE.CapsuleGeometry(0.06, 1.1, 3, 8), toon("#774a2b")); r.rotation.z = Math.PI / 2; r.scale.set(1, 1, 0.55); r.position.set(0, 0.12, (f - 1) * 0.3); bed.add(r); }
scene.add(bed);
const LEAFA = "#5f9e45", LEAFB = "#7cbb52";
function leafy(h, n) { const G = new THREE.Group(); const st = mesh(new THREE.CylinderGeometry(0.02, 0.03, h, 6), toon(LEAFA)); st.position.y = h / 2; G.add(st);
  for (let i = 0; i < n; i++) { const l = mesh(new THREE.SphereGeometry(0.08, 8, 6), toon(i % 2 ? LEAFB : LEAFA)); l.scale.set(1.7, 0.3, 0.75); const a = i * 2.4; l.position.set(Math.cos(a) * 0.1, 0.1 + (h - 0.1) * (i / Math.max(1, n)), Math.sin(a) * 0.1); l.rotation.y = -a; l.rotation.z = 0.35; G.add(l); } return G; }
function pod() { const G = leafy(0.7, 6); const p = mesh(new THREE.SphereGeometry(0.11, 14, 10), toon("#f2c544", { emissive: new THREE.Color("#5a3f00") })); p.scale.set(0.85, 1.25, 0.85); p.position.y = 0.82; G.add(p); return G; }
function seed() { const G = new THREE.Group(); const s = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 8), new THREE.MeshBasicMaterial({ color: "#fff6d8" })); s.scale.set(.8, 1.2, .8); s.position.y = 0.14; G.add(s); return G; }
let plant = null;
function show(m) {
  if (plant) { scene.remove(plant); }
  const S = m.ripe ? 1.5 : 1.35;
  plant = m.ripe ? (m.family ? cropMesh(m.family) : pod()) : (m.grow > 0 ? leafy(0.14 + m.grow * 0.5, 2 + Math.round(m.grow * 5)) : seed());
  plant.scale.setScalar(S); plant.position.set(0, 0.1, 0); scene.add(plant); draw();
}
function size() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
function draw() { renderer.render(scene, camera); }
addEventListener("resize", () => { size(); draw(); }); size();
addEventListener("message", (e) => { if (e.origin !== location.origin || e.data?.type !== "ally-gate-crop") return; show(e.data); });
parent.postMessage({ type: "ally-gate-crop-ready" }, location.origin);
const q = new URLSearchParams(location.search); if (q.get("family") || q.get("grow") != null) show({ family: q.get("family") || null, grow: +(q.get("grow") || 0), ripe: q.get("ripe") === "1" });
</script>
</body></html>
