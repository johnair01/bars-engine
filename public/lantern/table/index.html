<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0908">
<title>Lantern Hall</title>
<!-- The lantern table (bars-engine .specify/specs/lantern-table/spec.md). The scene is table.js; /lantern frames this page. The one text field takes the answer to the question the plate engraves.
     Nothing on the page is a control: every step is an object in the scene. The one line of text is the table speaking. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0a0908; overflow: hidden; }
  #stage, #stage canvas { position: fixed; inset: 0; display: block; touch-action: manipulation; }
  /* the table's voice: a line of lettering in the air of the hall, with no box behind it */
  .cap { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); top: calc(14px + env(safe-area-inset-top, 0px));
    width: min(88vw, 620px); text-align: center; font: 1.02rem/1.45 Marcellus, Georgia, serif; color: #f3ece2;
    text-shadow: 0 1px 4px rgba(0,0,0,.9), 0 0 18px rgba(0,0,0,.6); pointer-events: none; margin: 0; }
  @media (max-width: 600px) { .cap { font-size: .96rem; } }
  /* the goal: lettered low in the hall under the table, the one thing the whole machine works toward */
  .goal { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    width: min(88vw, 620px); text-align: center; margin: 0; pointer-events: none; color: #f6e7c1;
    text-shadow: 0 1px 4px rgba(0,0,0,.9), 0 0 18px rgba(0,0,0,.7); }
  .goal[hidden] { display: none; }
  .goal b { display: block; font: 400 1.32rem/1.25 Marcellus, Georgia, serif; color: #ffe3a1; text-wrap: balance; }
  .goal span { display: block; margin-top: 4px; font: .92rem/1.4 Marcellus, Georgia, serif; color: #e8dcc8; }
  @media (max-width: 600px) { .goal b { font-size: 1.12rem; } .goal span { font-size: .86rem; } }
  /* typing an answer: the plate in the scene is what shows the words, so the field itself stays out of sight */
  .letter { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; font-size: 16px; border: 0; padding: 0; }
  .loading { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: #0a0908; color: #e8dcc8;
    font: 1rem/1.4 Marcellus, Georgia, serif; text-align: center; transition: opacity .8s; }
  .loading.gone { opacity: 0; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .loading { transition: none; } }
  /* the question card: full screen while the six questions are asked, so a thumb can press and a keyboard can type.
     It brass-edges the same dark as the hall; when sent it shrinks over the table and the brass moves under it. */
  .qcard { position: fixed; inset: 0; z-index: 8; display: flex; flex-direction: column; justify-content: center; gap: 14px;
    box-sizing: border-box; height: 100dvh; padding: calc(18px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    overflow-y: auto; color: #f3ece2; font-family: Marcellus, Georgia, serif;
    background: radial-gradient(120% 90% at 50% 0%, #2a1d0e 0%, #14100a 62%, #0a0908 100%);
    border: 3px solid #a4823a; outline: 1px solid #5e4618; outline-offset: -9px; transform-origin: 50% 85%; }
  .qcard[hidden] { display: none; }
  .qcard > * { width: min(100%, 640px); margin-inline: auto; }
  .qcard.arriving { animation: qIn .55s cubic-bezier(.2,.8,.25,1) both; }
  .qcard.sending { animation: qOut .7s cubic-bezier(.5,0,.75,.4) both; pointer-events: none; }
  @keyframes qIn { from { opacity: 0; transform: translateY(-5vh) scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes qOut { 0% { opacity: 1; transform: none; border-radius: 0; } 100% { opacity: 0; transform: translateY(34vh) scale(.2); border-radius: 36px; } }
  .qn { margin: 0; font-size: .95rem; letter-spacing: .08em; text-transform: uppercase; color: #c9a65a; text-align: center; }
  .qt { margin: 0; font-weight: 400; font-size: clamp(1.45rem, 5.6vw, 2.1rem); line-height: 1.25; color: #ffe3a1; text-align: center; text-wrap: balance; }
  .qa { box-sizing: border-box; min-height: 5.4rem; padding: 12px 14px; font: 1.12rem/1.4 Marcellus, Georgia, serif; /* 16px floor, so a phone does not zoom */
    color: #1e1408; background: #c9ab67; border: 2px solid #5e4618; border-radius: 10px; resize: none; }
  .qa::placeholder { color: #5a4218; opacity: 1; }
  .qs { display: grid; gap: 10px; }
  .qb { box-sizing: border-box; min-height: 56px; padding: 12px 16px; font: 1.08rem/1.35 Marcellus, Georgia, serif; text-align: left; cursor: pointer;
    color: #f3ece2; background: #2b2012; border: 2px solid #7a5a24; border-radius: 10px; touch-action: manipulation; }
  .qb:active { background: #4a3716; }
  .qrow { display: flex; gap: 10px; }
  .qgo { flex: 1; min-height: 56px; font: 1.12rem Marcellus, Georgia, serif; cursor: pointer; color: #1e1408; background: #d9b45f; border: 2px solid #f5d98d; border-radius: 10px; touch-action: manipulation; }
  .qgo:active { background: #f5d98d; }
  .qlook { min-height: 56px; padding: 0 16px; font: 1rem Marcellus, Georgia, serif; cursor: pointer; color: #e8dcc8; background: transparent; border: 2px solid #5e4618; border-radius: 10px; touch-action: manipulation; }
  .qh { margin: 0; min-height: 1.4em; text-align: center; font-size: .98rem; color: #e8dcc8; }
  .qcard :focus-visible { outline: 3px solid #ffe3a1; outline-offset: 2px; }
  @media (min-width: 700px) { .qcard { justify-content: center; gap: 18px; } .qs { grid-template-columns: 1fr; } }
  @media (max-height: 560px) { .qcard { justify-content: flex-start; gap: 8px; } .qt { font-size: 1.25rem; } }
  @media (prefers-reduced-motion: reduce) { .qcard.arriving, .qcard.sending { animation: none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head><body>
<div id="stage" role="img" aria-label="Lantern Hall: an empty hex table with a brass machine set into it, under a hanging lantern. Tap an object on the table to work it."></div>
<p class="cap" id="caption" aria-live="polite"></p>
<p class="goal" id="goal" hidden><b id="goalName"></b><span id="goalLeft"></span></p>
<input class="letter" id="goalInput" type="text" maxlength="160" autocomplete="off" enterkeyhint="done" aria-label="Your answer to the question on the plate">
<section class="qcard" id="qcard" role="dialog" aria-modal="true" aria-labelledby="qText" hidden>
  <p class="qn" id="qNum"></p>
  <h2 class="qt" id="qText"></h2>
  <textarea class="qa" id="qInput" rows="3" maxlength="400" enterkeyhint="done" autocomplete="off" aria-label="Your answer" placeholder="Type your answer, or press one below."></textarea>
  <div class="qs" id="qStocks"></div>
  <p class="qh" id="qHint" aria-live="polite"></p>
  <div class="qrow"><button class="qlook" id="qLook" type="button">Look at the table</button><button class="qgo" id="qGo" type="button">Stamp it on the table</button></div>
</section>
<div class="loading" id="loading"><div><p>The lantern hall is lighting its lanterns.</p><p id="loadStep" style="font-size:.8rem;opacity:.6">starting</p></div></div>
<script>setTimeout(function(){var e=document.getElementById("loadStep");if(e&&e.textContent==="starting"){e.textContent="The 3D library did not load. Check the connection and reload.";}},20000);</script>
<script type="module" src="./table.js"></script>
</body></html>
