<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Calrunian jian family</title>
  <style>
    :root{color-scheme:dark;font:16px/1.4 system-ui,sans-serif;background:#20272b;color:#e9e5d9}
    *{box-sizing:border-box}body{margin:0;padding:24px;max-width:1200px;margin-inline:auto}
    h1{font:500 clamp(1.5rem,4vw,2.2rem)/1.1 Georgia,serif;margin:0 0 8px}
    p{margin:0 0 20px;color:#b7bdb7}.layout{display:grid;grid-template-columns:minmax(280px,1fr) 340px;gap:20px}
    #stage{height:min(70vh,620px);min-height:420px;border:1px solid #43504f;border-radius:12px;overflow:hidden;background:#30383b}
    #stage canvas{display:block;width:100%;height:100%}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start}
    button{background:#2c3436;color:inherit;border:1px solid #58645d;border-radius:10px;padding:8px;cursor:pointer;text-align:center;font:inherit}
    button[aria-pressed=true]{outline:2px solid #bcb08a;background:#374139}button img{display:block;object-fit:contain;height:145px;width:100%}
    button span{display:block;margin-top:5px}#status{min-height:1.5em;margin-top:12px;color:#c7c3ac}
    @media(max-width:760px){.layout{grid-template-columns:1fr}.cards{grid-template-columns:repeat(5,minmax(0,1fr))}button{font-size:.75rem;padding:4px}button img{height:100px}#stage{min-height:350px;height:50vh}}
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
  <h1>Calrunian jian family</h1>
  <p>Five reusable inventory studies. Select a sword to inspect its game model.</p>
  <div class="layout"><div><div id="stage" aria-label="Selected sword in 3D"></div><div id="status" role="status">Loading asset catalog…</div></div><div class="cards" id="cards"></div></div>
  <script type="module">
    import * as THREE from "three";
    import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
    import {jianCatalog,loadJian} from "./index.js";
    const stage=document.getElementById("stage"),cards=document.getElementById("cards"),status=document.getElementById("status");
    const scene=new THREE.Scene();scene.background=new THREE.Color("#30383b");
    const camera=new THREE.PerspectiveCamera(35,1,.05,20);camera.position.set(.16,.32,2.4);camera.lookAt(0,.32,0);
    const renderer=new THREE.WebGLRenderer({antialias:true});renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
    stage.appendChild(renderer.domElement);
    scene.add(new THREE.AmbientLight(0xffffff,1.8));
    const key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(-1,2,3);scene.add(key);
    const fill=new THREE.DirectionalLight(0xb8cfcc,1.3);fill.position.set(1,0,-2);scene.add(fill);
    const loader=new GLTFLoader();let current=null,request=0;
    function size(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
    new ResizeObserver(size).observe(stage);size();
    async function select(nation){
      const id=++request;status.textContent=`Loading ${nation}…`;
      for(const b of cards.querySelectorAll("button"))b.setAttribute("aria-pressed",String(b.dataset.nation===nation));
      try{const {scene:asset,gripSocket}=await loadJian(loader,nation);if(id!==request)return;
        if(current)scene.remove(current);current=asset;scene.add(asset);
        status.textContent=`${nation} · GripSocket present at ${gripSocket.position.y.toFixed(3)} m`;
      }catch(error){if(id===request)status.textContent=`Could not load ${nation}: ${error.message}`;console.error(error)}
    }
    try{const catalog=await jianCatalog();
      for(const [slug,entry] of Object.entries(catalog.variants)){
        const b=document.createElement("button");b.type="button";b.dataset.nation=entry.nation;b.setAttribute("aria-pressed","false");
        const img=document.createElement("img");img.src=entry.inventory_icon;img.alt="";
        const label=document.createElement("span");label.textContent=entry.nation;
        b.append(img,label);b.addEventListener("click",()=>select(entry.nation));cards.appendChild(b);
      }
      select("Argyra");
    }catch(error){status.textContent=`Could not read catalog: ${error.message}`;console.error(error)}
    function frame(){requestAnimationFrame(frame);if(current)current.rotation.y+=.004;renderer.render(scene,camera)}frame();
  </script>
</body>
</html>
